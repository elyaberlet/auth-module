services:
  postgres:
    image: postgres:16
    container_name: auth-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: authuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-authpassword}
    ports:
      - "5434:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authuser -d authdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: .
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/authdb
      DB_USERNAME: authuser
      DB_PASSWORD: ${DB_PASSWORD:-authpassword}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      USER_SERVICE_URL: http://user-service:8081
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_USER_ID: ${ADMIN_USER_ID:-}
    ports:
      - "8082:8082"
    secrets:
      - jwt_private_key
      - jwt_public_key

volumes:
  auth_postgres_data:

secrets:
  jwt_private_key:
    file: ./secrets/private_key.pem
  jwt_public_key:
    file: ./secrets/public_key.pem