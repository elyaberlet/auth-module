spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/authdb}
    username: ${DB_USERNAME:authuser}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

auth:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:./secrets/private_key.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:./secrets/public_key.pem}

logging:
  level:
    org.springframework.security: DEBUG